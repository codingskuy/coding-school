name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: bun install
      - name: Type check
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Claude Code plugin files are up to date
        run: bun run gen:claude-code && git diff --exit-code .claude-plugin claude-code
      - name: Run tests
        run: bun test
